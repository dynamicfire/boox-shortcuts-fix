plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xuanzhou.booxsettings'
    compileSdk 33

    defaultConfig {
        applicationId "com.xuanzhou.booxsettings"
        minSdk 30
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
